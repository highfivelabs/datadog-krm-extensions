apiVersion: v1
kind: Secret
metadata:
  name: datadog-credentials
  namespace: team-a
stringData:
  apiKey: <apiKey>
  appKey: <appKey>
---
apiVersion: core.datadog.hfl.dev/v1alpha1
kind: Connection
metadata:
  name: default
  namespace: team-a
spec:
  baseURL: https://api.datadoghq.com
  secretRef:
    name: datadog-credentials
