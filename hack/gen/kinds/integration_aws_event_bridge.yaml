terraform: [datadog_integration_aws_event_bridge]
shape: crud
envelope: data
bodyEnvelope: data
# A read answers the source's name and region only.
compareReturnedOnly: true
params:
  account_id: {field: attributes.account_id}
  region: {field: attributes.region}
fields:
  type:
    type: string
    enum: [event_bridge]
  attributes:
    type: object
    required: [account_id, event_generator_name, region]
    properties:
      account_id:
        type: string
        description: Your AWS Account ID without dashes.
      event_generator_name:
        type: string
        description: The given part of the event source name, which is then combined with an assigned suffix to form the full name.
      region:
        type: string
        description: The event source's AWS region.
      create_event_bus:
        type: boolean
        description: Set to true if Datadog should create the event bus in addition to the event source. Requires the `events:CreateEventBus` permission.
required: [type, attributes]
id: attributes.event_source_name
sample:
  type: event_bridge
  attributes: {account_id: "123456789012", event_generator_name: app-alerts, region: us-east-1}
create:
  method: POST
  path: /api/v2/integration/aws/event_bridge
read:
  method: GET
  path: /api/v2/integration/aws/event_bridge
  find: {list: data/attributes/accounts/*/event_hubs, field: name}
delete:
  method: DELETE
  path: /api/v2/integration/aws/event_bridge
  body: {type: event_bridge, attributes: {account_id: "{account_id}", region: "{region}", event_generator_name: "{id}"}}
