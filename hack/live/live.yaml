#
# Live tests (TestEveryKindLive, krm-rest-runtime's kindtest.Live): these
# kinds, in this order, against a real Datadog organization. Kinds not listed
# are not run live. They skip, naming the secret, until it exists in Secret
# Manager; then
#   KRM_LIVE=1 go test -tags live -run TestEveryKindLive -v .
# Everything a run makes is named hfl-live-<stamp>-<hex> (or hfl_live_...),
# deleted at the end; the sweep deletes older leftovers. How it works and
# what the {{...}} templates mean: krm-rest-runtime docs/live.md.
#
# The organization is a 14-day trial with no card. Nothing listed is billed
# by usage or turns on a paid product: no hosts, no log indexes or archives,
# no synthetic test runs, no Cloud SIEM, no metric submission. Users are
# hfl-live-...@example.com and never invited; notifications name no real
# person or integration. Kinds that would need any of that, a third-party
# account, or a change to the organization's settings or authentication are
# listed with skip: and why.
#
# Datadog's v2 API is JSON:API: a spec is the request's data object (type,
# attributes, relationships). A PATCH must name the type, so the drift step
# sends the object as read with attributes replaced (driftFull), and change:
# and drift: give the whole attributes object.
secret: krm-live-datadog        # JSON: {"apiKey": "...", "appKey": "...", "site": "us5.datadoghq.com", "baseURL": "https://api.us5.datadoghq.com"}
target: Datadog trial

# One team and one dashboard the kinds hang off; deleted at the end.
before:
- {method: POST, path: /api/v2/team, body: {data: {type: team, attributes: {handle: "{{run}}", name: "{{run}}"}}}, save: {team: data/id}}
- {method: POST, path: /api/v1/dashboard, body: {title: "{{run}}", layout_type: ordered, widgets: []}, save: {dashboard: id}}
after:
- {method: DELETE, path: "/api/v1/dashboard/{{var:dashboard}}", ok: [404]}
- {method: DELETE, path: "/api/v2/team/{{var:team}}", ok: [404]}

sweep:
- {list: "/api/v2/roles?filter=hfl-live-&page[size]=100", items: data, name: attributes/name, id: id, delete: "/api/v2/roles/{id}"}
- {list: "/api/v2/team?filter[keyword]=hfl-live-&page[size]=100", items: data, name: attributes/handle, id: id, delete: "/api/v2/team/{id}"}
- {list: "/api/v1/dashboard/lists/manual", items: dashboard_lists, name: name, id: id, delete: "/api/v1/dashboard/lists/manual/{id}"}
- {list: "/api/v1/dashboard?filter[shared]=false", items: dashboards, name: title, id: id, delete: "/api/v1/dashboard/{id}"}
- {list: "/api/v2/powerpacks?page[limit]=100", items: data, name: attributes/name, id: id, delete: "/api/v2/powerpacks/{id}"}
- {list: "/api/v1/downtime?current_only=false", name: message, id: id, delete: "/api/v1/downtime/{id}"}
- {list: "/api/v1/slo?query=hfl-live-", items: data, name: name, id: id, delete: "/api/v1/slo/{id}"}
- {list: /api/v2/incidents/config/types, items: data, name: attributes/name, id: id, delete: "/api/v2/incidents/config/types/{id}"}
- {list: /api/v2/rum/applications, items: data, name: attributes/name, id: id, delete: "/api/v2/rum/applications/{id}"}
- {list: "/api/v2/users?filter=hfl-live-&filter[status]=Active,Pending&page[size]=100", items: data, name: attributes/email, id: id, delete: "/api/v2/users/{id}"}
- {list: /api/v1/synthetics/private-locations, name: name, id: id, delete: "/api/v1/synthetics/private-locations/{id}"}
- {list: "/api/v2/api_keys?filter=hfl-live-", items: data, name: attributes/name, id: id, delete: "/api/v2/api_keys/{id}"}
- {list: /api/v2/monitor/notification_rule, items: data, name: attributes/name, id: id, delete: "/api/v2/monitor/notification_rule/{id}"}
- {list: /api/v2/monitor/policy, items: data, name: attributes/policy/tag_key, id: id, delete: "/api/v2/monitor/policy/{id}"}
- {list: /api/v2/incidents/config/notification-templates, items: data, name: attributes/name, id: id, delete: "/api/v2/incidents/config/notification-templates/{id}"}
- {list: /api/v2/actions-datastores, items: data, name: attributes/name, id: id, delete: "/api/v2/actions-datastores/{id}"}
- {list: "/api/v2/app-builder/apps?filter[query]=hfl-live-", items: data, name: attributes/name, id: id, delete: "/api/v2/app-builder/apps/{id}"}
- {list: /api/v2/actions/execution-policies, items: data, name: attributes/name, id: id, delete: "/api/v2/actions/execution-policies/{id}"}
- {list: /api/v2/datasets, items: data, name: attributes/name, id: id, delete: "/api/v2/datasets/{id}"}
- {list: /api/v2/deployment_gates, items: data, name: attributes/service, id: id, delete: "/api/v2/deployment_gates/{id}"}
- {list: /api/v2/governance/tag_rules, items: data, name: attributes/name, id: id, delete: "/api/v2/governance/tag_rules/{id}"}
- {list: /api/v2/metrics/tag-indexing-rules, items: data, name: attributes/name, id: id, delete: "/api/v2/metrics/tag-indexing-rules/{id}"}
- {list: /api/v2/logs/config/metrics, items: data, name: id, delete: "/api/v2/logs/config/metrics/{id}"}
- {list: /api/v2/logs/config/custom-destinations, items: data, name: attributes/name, id: id, delete: "/api/v2/logs/config/custom-destinations/{id}"}
- {list: /api/v2/rum/config/metrics, items: data, name: id, delete: "/api/v2/rum/config/metrics/{id}"}
- {list: /api/v2/security/findings/automation/mute_rules, items: data, name: attributes/name, id: id, delete: "/api/v2/security/findings/automation/mute_rules/{id}"}
- {list: /api/v2/security/findings/automation/inbox_rules, items: data, name: attributes/name, id: id, delete: "/api/v2/security/findings/automation/inbox_rules/{id}"}
- {list: /api/v2/security/findings/automation/due_date_rules, items: data, name: attributes/name, id: id, delete: "/api/v2/security/findings/automation/due_date_rules/{id}"}
- {list: /api/v2/security/findings/automation/severity_modifier_rules, items: data, name: attributes/name, id: id, delete: "/api/v2/security/findings/automation/severity_modifier_rules/{id}"}
- {list: "/api/v2/current_user/application_keys?filter=hfl-live-&page[size]=100", items: data, name: attributes/name, id: id, delete: "/api/v2/current_user/application_keys/{id}"}
- {list: "/api/v1/monitor?name=hfl-live-", name: name, id: id, delete: "/api/v1/monitor/{id}"}
- {list: /api/v1/synthetics/variables, items: variables, name: name, id: id, delete: "/api/v1/synthetics/variables/{id}"}
- {list: /api/v1/logs/config/pipelines, name: name, id: id, delete: "/api/v1/logs/config/pipelines/{id}"}
- {list: /api/v2/workflows, items: data, name: attributes/name, id: id, delete: "/api/v2/workflows/{id}"}
- {list: /api/v2/statuspages, items: data, name: attributes/name, id: id, delete: "/api/v2/statuspages/{id}"}
- {list: "/api/v2/services/definitions?page[size]=100", items: data, name: attributes/schema/dd-service, delete: "/api/v2/services/definitions/{id}"}

