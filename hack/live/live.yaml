- kind: Downtime
  replaceSample: true
  spec: {scope: ["hfl-live:{{name}}"], message: "{{name}} first"}
  change: {message: "{{name}} second"}
  stays: a deleted downtime is canceled, and a read still answers it (with canceled set)

- kind: SloCorrection
  replaceSample: true
  before:
  - method: POST
    path: /api/v1/slo
    body: {name: "{{name}}", type: metric, query: {numerator: "sum:hfl.live.good{*}.as_count()", denominator: "sum:hfl.live.total{*}.as_count()"}, thresholds: [{timeframe: 7d, target: 99}]}
    save: {slo: data/0/id}
  after:
  - {method: DELETE, path: "/api/v1/slo/{{var:slo}}", ok: [404]}
  spec:
    type: correction
    attributes: {slo_id: "{{var:slo}}", start: 1767225600, end: 1767229200, category: Scheduled Maintenance, description: "{{name}} first", timezone: UTC}
  change:
    attributes: {slo_id: "{{var:slo}}", start: 1767225600, end: 1767229200, category: Scheduled Maintenance, description: "{{name}} second", timezone: UTC}
  drift: {slo_id: "{{var:slo}}", start: 1767225600, end: 1767229200, category: Scheduled Maintenance, description: "{{name}} drift", timezone: UTC}
  driftFull: true

- kind: User
  replaceSample: true
  spec: {type: users, attributes: {email: "{{name}}@example.com", name: "{{name}}"}}
  change: {attributes: {email: "{{name}}@example.com", name: "{{name}}-changed"}}
  drift: {email: "{{name}}@example.com", name: "{{name}}-drift"}
  driftFull: true
  noDrift: a write of the user as read is refused (relationships org and roles are not allowed in an update), and a write of attributes alone lacks the type
  stays: Datadog never deletes a user; a delete disables it and a read still answers

