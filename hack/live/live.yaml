  change: {rule_ids: ["{{var:ruleB}}", "{{var:ruleA}}"]}
  drift: ["{{var:ruleA}}", "{{var:ruleB}}"]

- kind: TagIndexingRuleOrder
  before:
  - {method: POST, path: /api/v2/metrics/tag-indexing-rules, body: {data: {type: tag_indexing_rules, attributes: {name: "{{name}}-a", metric_name_matches: ["hfl.live.{{name_}}_a"]}}}, save: {ruleA: data/id}}
  - {method: POST, path: /api/v2/metrics/tag-indexing-rules, body: {data: {type: tag_indexing_rules, attributes: {name: "{{name}}-b", metric_name_matches: ["hfl.live.{{name_}}_b"]}}}, save: {ruleB: data/id}}
  after:
  - {method: DELETE, path: "/api/v2/metrics/tag-indexing-rules/{{var:ruleA}}", ok: [404]}
  - {method: DELETE, path: "/api/v2/metrics/tag-indexing-rules/{{var:ruleB}}", ok: [404]}
  replaceSample: true
  spec: {rule_ids: ["{{var:ruleA}}", "{{var:ruleB}}"]}
  change: {rule_ids: ["{{var:ruleB}}", "{{var:ruleA}}"]}
  drift: ["{{var:ruleA}}", "{{var:ruleB}}"]

# A role made for the kind given to a user made for it (never invited).
- kind: UserRole
  before:
  - {method: POST, path: /api/v2/roles, body: {data: {type: roles, attributes: {name: "{{name}}"}}}, save: {role: data/id}}
  - {method: POST, path: /api/v2/users, body: {data: {type: users, attributes: {email: "{{name}}@example.com", name: "{{name}}"}}}, save: {roleUser: data/id}}
  after:
  - {method: DELETE, path: "/api/v2/users/{{var:roleUser}}", ok: [404]}
  - {method: DELETE, path: "/api/v2/roles/{{var:role}}", ok: [404]}
  replaceSample: true
  spec: {roleID: "{{var:role}}", id: "{{var:roleUser}}", type: users}

# A software catalog entry (schema v2.2) owned by the run's team.
- kind: ServiceDefinitionYaml
  replaceSample: true
  spec: {schema-version: v2.2, dd-service: "{{name}}", team: "{{run}}", description: first}
  change: {description: second}
  driftFull: true                # the POST needs the whole definition

# A suite of synthetic tests with none in it: nothing runs.
- kind: SyntheticsSuite
  replaceSample: true
  spec: {type: suites, attributes: {name: "{{name}}", type: suite, tests: [], options: {}, message: first}}
  change: {attributes: {name: "{{name}}", type: suite, tests: [], options: {}, message: second}}
  drift: {name: "{{name}}", type: suite, tests: [], options: {}, message: drift}
  driftFull: true

